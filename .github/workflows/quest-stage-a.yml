name: SHADDA Quest APK - Stage A
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'assets/models/original/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'assets/models/original/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 12266719
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-36' 'platforms;android-34' 'build-tools;36.1.0' 'ndk;29.0.14206865'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shadda-development-signing-v1
      - name: Create development signing key when absent
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=SHADDA Development,O=ABODEN GAMES,C=SA'
          fi
      - name: Install verified Godot and OpenXR Vendors
        run: python3 tools/setup_ci.py
      - name: Import actual game resources
        run: godot --headless --xr-mode off --path . --import
      - name: Verify native Meta extension registration
        run: godot --headless --xr-mode off --path . --script tests/test_meta_extension.gd
      - name: Test intro timing and focus interruption
        run: godot --headless --xr-mode off --path . --script tests/test_intro.gd
      - name: Capture in-engine preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          timeout 120 xvfb-run -a godot --path . --xr-mode off --audio-driver Dummy --rendering-method gl_compatibility -- --preview
      - name: Export native ARM64 Android APK
        run: godot --headless --xr-mode off --path . --install-android-build-template --export-debug Quest build/SHADDA-Quest-AR-v0.1.0.apk
      - name: Verify manifest, ABI, splash, and certificate
        run: python3 tools/verify_apk.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SHADDA-Quest-AR-v0.1.0-stage-a
          path: build/
          if-no-files-found: error
          retention-days: 14
